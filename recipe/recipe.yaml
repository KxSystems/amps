context:
  version: ${{ env.get("PKGVER", default="0.1.0") }}

package:
  name: q-kx-amps
  version: ${{ version }}

source:
  path: ..
  use_gitignore: false
  filter:
    exclude:
      - recipe/**
      - build/**
      - src/*.o
      - src/*.d

build:
  number: 0
  skip:
     - not linux and x86_64
  script:
    - make OUTDIR=${PREFIX}/lib/q/mod/kx/amps

requirements:
  build:
    - ${{ compiler("cxx") }}
    - make

tests:
  - script:
    - if: linux and x86_64
      then:
        - test -f ${PREFIX}/lib/q/mod/kx/amps/init.q
        - test -f ${PREFIX}/lib/q/mod/kx/amps/clib.li64.so
        
about:
  license_file:
    - external/amps-c++-client-5.3.5.6-Linux/LICENSE 